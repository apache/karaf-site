<!-- Bootstrap 5 JS bundle (no jQuery required) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- Anchor links (for doc-friendly headings) if available -->
<script src="/assets/js/vendor/anchor.min.js"></script>

<script type="text/javascript">
  (function () {
    var root = document.documentElement;
    var toggle = document.getElementById('theme-toggle');

    function setTheme(theme) {
      root.setAttribute('data-bs-theme', theme);
    }

    function applyTheme(theme) {
      setTheme(theme);
      try { localStorage.setItem('karaf-theme', theme); } catch (e) {}
    }

    if (toggle) {
      toggle.addEventListener('click', function () {
        var current = root.getAttribute('data-bs-theme') === 'dark' ? 'dark' : 'light';
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });
    }

    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        var saved = null;
        try { saved = localStorage.getItem('karaf-theme'); } catch (err) {}
        if (!saved) { setTheme(e.matches ? 'dark' : 'light'); }
      });
    }
  })();
</script>
