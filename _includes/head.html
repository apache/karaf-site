<meta charset="utf-8">
<title>{{ page.title }}</title>
<meta content="width=device-width, initial-scale=1" name="viewport">
<meta content="" name="keywords">
<meta content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" name="description">

<!-- jekyll-seo-tag plugin -->
{% seo %}

<!-- Favicons -->
<link href="/images/favicon.ico" rel="icon">
<link rel="icon" type="image/svg+xml" href="/images/feather.svg">

<!-- Bootstrap 5 + FontAwesome + Inter/JetBrains Mono (all bundled into karaf.css, see _scss/karaf.scss) + Karaf theme -->
<link href="/assets/css/karaf.css" rel="stylesheet">

<!-- Set theme before paint to avoid flash -->
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('karaf-theme'); } catch (e) {}
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-bs-theme', theme);
  })();
</script>
